[package]
name = "zd-app"
description = "ZD-Photos desktop app (Qt 6 / QML)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "zd-photos"
path = "src/main.rs"

[dependencies]
zd-catalog.workspace = true
zd-volumes.workspace = true
zd-import.workspace = true
directories.workspace = true
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
